<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presupuesto · Proper Pauta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    /* ============ LIGHT (default) ============ */
    --bg:               #FAFAFA;
    --bg-card:          #FFFFFF;
    --bg-subtle:        #F4F4F5;
    --bg-hover:         #F9FAFB;
    --border:           #ECEFF3;
    --border-strong:    #D0D5DD;
    --text:             #101828;
    --text-2:           #344054;
    --muted:            #667085;
    --muted-2:          #98A2B3;
    --accent:           #4F46E5;
    --accent-hover:     #4338CA;
    --accent-bg:        #EEF2FF;
    --accent-border:    #C7D2FE;
    --success:          #079455;
    --success-bg:       #ECFDF3;
    --success-border:   #ABEFC6;
    --warning:          #DC6803;
    --warning-bg:       #FFFAEB;
    --warning-border:   #FEDF89;
    --danger:           #D92D20;
    --danger-bg:        #FEF3F2;
    --danger-border:    #FECDCA;

    --radius:           16px;
    --radius-md:        12px;
    --radius-sm:        8px;
    --radius-xs:        6px;

    --font:             'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  [data-theme="dark"] {
    --bg:               #0B0D11;
    --bg-card:          #14171C;
    --bg-subtle:        #1B1F26;
    --bg-hover:         #1F2329;
    --border:           #232830;
    --border-strong:    #353B45;
    --text:             #F2F4F7;
    --text-2:           #D0D5DD;
    --muted:            #98A2B3;
    --muted-2:          #667085;
    --accent:           #818CF8;
    --accent-hover:     #A5B4FC;
    --accent-bg:        rgba(129, 140, 248, 0.10);
    --accent-border:    rgba(129, 140, 248, 0.30);
    --success:          #32D583;
    --success-bg:       rgba(50, 213, 131, 0.10);
    --success-border:   rgba(50, 213, 131, 0.30);
    --warning:          #FDB022;
    --warning-bg:       rgba(253, 176, 34, 0.10);
    --warning-border:   rgba(253, 176, 34, 0.30);
    --danger:           #F97066;
    --danger-bg:        rgba(249, 112, 102, 0.10);
    --danger-border:    rgba(249, 112, 102, 0.30);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.55;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background 140ms ease;
  }
  ::selection { background: var(--accent); color: #fff; }

  /* ============ LAYOUT ============ */
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  /* ============ TOPBAR ============ */
  .topbar {
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .topbar-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 60px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; font-size: 14px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .brand-mark {
    width: 22px; height: 22px;
    background: var(--text);
    color: var(--bg);
    border-radius: var(--radius-xs);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; letter-spacing: -0.02em;
  }
  .brand-sep { color: var(--muted-2); font-weight: 400; }
  .brand-sub { color: var(--muted); font-weight: 500; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 34px; padding: 0 12px;
    background: var(--bg-card); color: var(--text-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 140ms ease;
  }
  .btn:hover { background: var(--bg-hover); border-color: var(--border-strong); color: var(--text); }
  .btn:disabled { opacity: 0.7; cursor: wait; }
  .btn-icon { padding: 0; width: 34px; justify-content: center; }
  .btn svg { width: 14px; height: 14px; }
  .btn.loading svg.btn-refresh-ico { animation: spin 700ms linear infinite; }
  .btn.success { color: var(--success); border-color: var(--success-border); background: var(--success-bg); }
  .btn.fail    { color: var(--danger);  border-color: var(--danger-border);  background: var(--danger-bg); }

  /* ============ PAGE HEAD ============ */
  .page-head {
    padding: 32px 0 28px;
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .page-head h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .page-head .sub {
    margin-top: 4px;
    color: var(--muted);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }

  /* ============ MONTH SELECTOR (Plausible-style dropdown) ============ */
  .month-select { position: relative; }
  .month-select-trigger {
    display: inline-flex; align-items: center; gap: 10px;
    height: 38px; padding: 0 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 140ms ease;
    min-width: 220px;
    justify-content: space-between;
  }
  .month-select-trigger:hover { border-color: var(--border-strong); background: var(--bg-hover); }
  .month-select-trigger.open { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  .month-select-trigger .label {
    display: flex; flex-direction: column; align-items: flex-start;
    line-height: 1.15;
    text-align: left;
  }
  .month-select-trigger .label-main {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    text-transform: capitalize;
  }
  .month-select-trigger .label-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .month-select-trigger svg.chev {
    width: 14px; height: 14px;
    color: var(--muted);
    transition: transform 160ms ease;
  }
  .month-select-trigger.open svg.chev { transform: rotate(180deg); }

  .month-select-panel {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 320px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow:
      0 12px 24px -8px rgba(16, 24, 40, 0.10),
      0 4px 8px -2px rgba(16, 24, 40, 0.06);
    padding: 6px;
    z-index: 50;
    opacity: 0; pointer-events: none;
    transform: translateY(-4px);
    transition: opacity 150ms ease, transform 150ms ease;
  }
  [data-theme="dark"] .month-select-panel {
    box-shadow: 0 12px 24px -8px rgba(0,0,0,0.4), 0 4px 8px -2px rgba(0,0,0,0.3);
  }
  .month-select-panel.open {
    opacity: 1; pointer-events: auto;
    transform: translateY(0);
  }
  .month-option {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    padding: 10px 12px;
    align-items: center;
    border-radius: var(--radius-xs);
    cursor: pointer;
    transition: background 140ms ease;
  }
  .month-option:hover { background: var(--bg-hover); }
  .month-option.selected { background: var(--accent-bg); }
  .month-option .opt-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--border-strong);
    flex-shrink: 0;
  }
  .month-option.is-current .opt-dot { background: var(--success); box-shadow: 0 0 0 3px var(--success-bg); }
  .month-option .opt-label {
    display: flex; flex-direction: column;
    line-height: 1.2;
  }
  .month-option .opt-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    text-transform: capitalize;
  }
  .month-option.is-current .opt-name::after {
    content: "en curso";
    margin-left: 8px;
    font-size: 10px; font-weight: 500;
    color: var(--success);
    background: var(--success-bg);
    padding: 1px 6px;
    border-radius: 999px;
    vertical-align: 1px;
    text-transform: none;
  }
  .month-option .opt-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .month-option .opt-pct {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--bg-subtle);
  }
  .month-option .opt-pct.over { color: var(--danger); background: var(--danger-bg); }
  .month-option .opt-pct.warn { color: var(--warning); background: var(--warning-bg); }
  .month-option .opt-pct.ok   { color: var(--success); background: var(--success-bg); }

  /* ============ SECTIONS ============ */
  .section { margin-bottom: 28px; }
  .section-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 14px;
    gap: 16px; flex-wrap: wrap;
  }
  .section-title {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .section-desc {
    margin-top: 2px;
    font-size: 13px;
    color: var(--muted);
  }

  /* ============ CARD base ============ */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  /* ============ HERO ============ */
  .hero {
    padding: 28px 32px 24px;
  }
  .hero-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    flex-wrap: wrap; gap: 24px;
  }
  .hero-num {
    font-size: 44px;
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.05;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .hero-num .cur {
    font-size: 22px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: -0.01em;
    margin-right: 4px;
  }
  .hero-lbl {
    margin-top: 6px;
    font-size: 14px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .hero-lbl strong {
    color: var(--text-2);
    font-weight: 500;
  }
  .hero-right {
    text-align: right;
  }
  .hero-pct {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
  }
  .hero-pct-lbl {
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
  }

  /* Progress */
  .progress {
    margin-top: 28px;
    position: relative;
    height: 8px;
    background: var(--bg-subtle);
    border-radius: 999px;
    overflow: visible;
  }
  .progress-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--accent);
    border-radius: 999px;
    transition: width 700ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .progress-fill.warn { background: var(--warning); }
  .progress-fill.over { background: var(--danger); }
  .progress-marker {
    position: absolute;
    top: -3px; bottom: -3px;
    width: 2px;
    background: var(--text);
    border-radius: 1px;
  }
  .progress-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .progress-foot .ideal {
    display: inline-flex; align-items: center; gap: 6px;
  }
  .progress-foot .ideal::before {
    content: "";
    width: 8px; height: 2px;
    background: var(--text);
    border-radius: 1px;
  }

  /* Hero stats row */
  .hero-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  .hero-stat { padding: 0 20px; }
  .hero-stat:first-child { padding-left: 0; }
  .hero-stat:last-child { padding-right: 0; }
  .hero-stat + .hero-stat { border-left: 1px solid var(--border); }
  .hero-stat-lbl {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .hero-stat-lbl svg { width: 14px; height: 14px; flex-shrink: 0; }
  .hero-stat-val .unit {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
    letter-spacing: 0;
    margin-left: 2px;
  }
  .hero-stat-val {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.015em;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .hero-stat-val .cur {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
    margin-right: 2px;
  }
  .hero-stat-sub {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
    display: flex; align-items: center; gap: 6px;
    font-variant-numeric: tabular-nums;
  }

  /* Badge / delta */
  .delta {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 7px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .delta-up { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
  .delta-down { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
  .delta-warn { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning-border); }
  .delta-flat { background: var(--bg-subtle); color: var(--text-2); border: 1px solid var(--border); }
  .delta svg { width: 10px; height: 10px; }

  /* ============ PRODUCTOS (2 col) ============ */
  .product-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .product-card { padding: 20px 24px 22px; }
  .product-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; margin-bottom: 18px;
  }
  .product-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.005em;
  }
  .product-name-sub {
    margin-top: 2px;
    font-size: 12px;
    color: var(--muted);
  }
  .product-amt {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .product-amt-big {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .product-amt-big .cur { font-size: 13px; color: var(--muted); font-weight: 500; }
  .product-amt-sm {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Channel rows */
  .channel {
    display: grid;
    grid-template-columns: 110px 1fr auto;
    gap: 14px;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .channel:last-child { border-bottom: none; }
  .channel-name {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }
  .channel-logo {
    flex-shrink: 0;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
  }
  .channel-logo svg { width: 100%; height: 100%; display: block; }
  .channel-bar {
    position: relative;
    height: 6px;
    background: var(--bg-subtle);
    border-radius: 999px;
    overflow: visible;
  }
  .channel-bar .fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--accent);
    border-radius: 999px;
    transition: width 700ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .channel-bar .fill.warn    { background: var(--warning); }
  .channel-bar .fill.over    { background: var(--danger); }
  .channel-bar .fill.success { background: var(--success); }
  .channel-bar .marker {
    position: absolute; top: -2px; bottom: -2px;
    width: 1.5px;
    background: var(--text);
    border-radius: 1px;
  }
  .channel-stats {
    text-align: right;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .channel-pct {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .channel-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .channel-sub-rate {
    color: var(--muted-2);
    font-size: 11px;
    margin-top: 1px;
  }

  /* status pill */
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    line-height: 1;
  }
  .pill-ok    { background: var(--success-bg); color: var(--success); }
  .pill-warn  { background: var(--warning-bg); color: var(--warning); }
  .pill-over  { background: var(--danger-bg);  color: var(--danger);  }
  .pill-low   { background: var(--bg-subtle);  color: var(--muted);   }
  .pill .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  .product-footer {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .toggle-link {
    background: none;
    border: none;
    padding: 0;
    color: var(--accent);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .toggle-link:hover { color: var(--accent-hover); }
  .toggle-link svg { width: 12px; height: 12px; transition: transform 160ms ease; }
  .toggle-link.open svg { transform: rotate(180deg); }

  .campaigns {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    display: none;
  }
  .campaigns.open { display: block; }
  .campaign {
    display: grid; grid-template-columns: 1fr auto;
    gap: 12px; padding: 8px 0;
    align-items: center;
    font-size: 12px;
  }
  .campaign + .campaign { border-top: 1px dashed var(--border); }
  .campaign-name {
    color: var(--text-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: flex; align-items: center; gap: 8px;
  }
  .campaign-chip {
    flex-shrink: 0;
    width: 14px; height: 14px;
  }
  .campaign-chip svg { width: 100%; height: 100%; display: block; }
  .campaign-spend {
    color: var(--text);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  /* ============ ALERTS section ============ */
  .alerts-card { padding: 4px; }
  .alert {
    display: grid;
    grid-template-columns: 4px 1fr;
    gap: 0;
    padding: 0;
    border-radius: var(--radius-sm);
    overflow: hidden;
    transition: background 140ms ease;
  }
  .alert + .alert { margin-top: 4px; border-top: 1px solid var(--border); padding-top: 4px; }
  .alert + .alert .alert-marker { margin-top: 0; }
  .alert:hover { background: var(--bg-hover); }
  .alert-marker {
    background: var(--muted-2);
    border-radius: 2px;
    align-self: stretch;
    margin: 12px 0;
  }
  .alert-high .alert-marker     { background: var(--danger); }
  .alert-critical .alert-marker { background: var(--danger); }
  .alert-medium .alert-marker   { background: var(--warning); }
  .alert-under .alert-marker    { background: var(--accent); }

  .alert-body {
    padding: 14px 18px 14px 14px;
  }
  .alert-head {
    display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .alert-icons {
    display: inline-flex; align-items: center; gap: 4px;
  }
  .alert-icons svg { width: 14px; height: 14px; }
  .alert-product {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .alert-channel {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  .alert-channel::before {
    content: "/";
    margin: 0 6px;
    color: var(--muted-2);
  }
  .alert-tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    line-height: 1;
    margin-left: 4px;
  }
  .alert-tag.over     { background: var(--danger-bg);  color: var(--danger);  }
  .alert-tag.warn     { background: var(--warning-bg); color: var(--warning); }
  .alert-tag.under    { background: var(--accent-bg);  color: var(--accent);  }
  .alert-tag .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: currentColor;
  }
  .alert-msg {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.55;
    margin-bottom: 4px;
  }
  .alert-msg strong {
    color: var(--text);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .alert-rec {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    font-style: normal;
  }
  .alert-rec::before {
    content: "→ ";
    color: var(--accent);
    font-weight: 600;
  }
  .alerts-empty {
    padding: 32px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  .alerts-summary {
    font-size: 12px;
    color: var(--muted);
    padding: 0 4px;
    font-variant-numeric: tabular-nums;
  }
  .alerts-summary .count {
    color: var(--text);
    font-weight: 600;
  }

  /* ============ CHART card ============ */
  .chart-card { padding: 20px 24px 22px; }
  .chart-toolbar {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .chart-legend {
    display: flex; align-items: center; gap: 16px;
    font-size: 13px;
    color: var(--text-2);
  }
  .legend-item {
    display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer; user-select: none;
    transition: opacity 140ms ease;
    font-weight: 500;
  }
  .legend-item.muted { opacity: 0.4; }
  .legend-item .swatch {
    width: 10px; height: 10px;
    border-radius: 2px;
  }

  .range-tabs {
    display: inline-flex;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 3px;
    margin-left: auto;
    gap: 2px;
  }
  .range-tab {
    height: 26px; padding: 0 10px;
    background: transparent;
    border: none;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    border-radius: 5px;
    font-family: inherit;
    cursor: pointer;
    transition: all 140ms ease;
  }
  .range-tab:hover { color: var(--text-2); }
  .range-tab.active {
    background: var(--bg-card);
    color: var(--text);
    box-shadow: 0 1px 2px rgba(16,24,40,0.08);
  }
  [data-theme="dark"] .range-tab.active { background: var(--border-strong); }

  .chart-wrap { height: 280px; position: relative; }

  .chart-stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .chart-stat {
    padding: 0 18px;
  }
  .chart-stat:first-child { padding-left: 0; }
  .chart-stat:last-child { padding-right: 0; }
  .chart-stat + .chart-stat { border-left: 1px solid var(--border); }
  .chart-stat-lbl {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .chart-stat-val {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.015em;
    font-variant-numeric: tabular-nums;
  }
  .chart-stat-val .cur { font-size: 13px; color: var(--muted); font-weight: 500; }
  .chart-stat-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }

  /* ============ HISTORICO TABLE ============ */
  .history { padding: 0; }
  .history table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .history thead th {
    text-align: right;
    padding: 14px 16px;
    font-weight: 500;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    background: var(--bg-card);
    white-space: nowrap;
  }
  .history thead th:first-child { text-align: left; }
  .history thead th .grp {
    display: block;
    font-size: 11px;
    color: var(--muted-2);
    font-weight: 400;
    margin-bottom: 2px;
  }
  .history tbody td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text-2);
  }
  .history tbody tr:last-child td { border-bottom: none; }
  .history tbody td:first-child {
    text-align: left;
    color: var(--text);
    font-weight: 500;
  }
  .history tbody td:first-child small {
    display: block;
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
    margin-top: 1px;
    font-variant-numeric: tabular-nums;
  }
  .history tbody tr.current {
    background: var(--accent-bg);
  }
  .history tbody tr.current td { border-bottom-color: var(--accent-border); }
  .history tbody tr.current td:first-child {
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .history .total { font-weight: 600; color: var(--text); font-size: 14px; }

  .verdict-cell { min-width: 200px; }
  .mini-bar {
    position: relative;
    width: 100%; max-width: 140px;
    height: 5px;
    background: var(--bg-subtle);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 5px;
    margin-left: auto;
  }
  .mini-bar .fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--text);
    border-radius: 999px;
  }
  .mini-bar .fill.over    { background: var(--danger); }
  .mini-bar .fill.warn    { background: var(--warning); }
  .mini-bar .fill.ok      { background: var(--success); }
  .mini-bar .fill.partial { background: var(--accent); }
  .mini-bar .target {
    position: absolute;
    top: -1px; bottom: -1px;
    left: 100%; width: 1px;
    background: var(--muted-2);
  }
  .verdict-row {
    display: flex; align-items: center; gap: 10px;
    justify-content: flex-end;
    font-size: 12px;
    color: var(--muted);
  }
  .verdict-row .pct {
    font-weight: 600; color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  /* ============ LOADING / ERR ============ */
  .loading {
    padding: 80px 0; text-align: center; color: var(--muted);
    font-size: 14px;
  }
  .loading::before {
    content: ""; display: inline-block;
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 700ms linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err {
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    color: var(--danger);
    border-radius: var(--radius);
    padding: 16px 20px;
    font-size: 13px;
  }

  /* ============ FOOTER ============ */
  .footer {
    margin: 40px 0 60px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    display: flex; justify-content: space-between; gap: 16px;
    flex-wrap: wrap;
  }
  .footer code {
    background: var(--bg-subtle);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    color: var(--text-2);
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 920px) {
    .hero-top { flex-direction: column; gap: 12px; }
    .hero-right { text-align: left; }
    .hero-stats { grid-template-columns: 1fr; gap: 0; }
    .hero-stat { padding: 16px 0; border-left: none !important; }
    .hero-stat + .hero-stat { border-top: 1px solid var(--border); }
    .product-grid { grid-template-columns: 1fr; }
    .chart-stats { grid-template-columns: 1fr 1fr; }
    .chart-stat { padding: 16px 12px; }
    .chart-stat:nth-child(2n+1) { padding-left: 0; }
    .chart-stat:nth-child(2n) { padding-right: 0; }
    .chart-stat + .chart-stat { border-left: none; }
    .chart-stat:nth-child(n+3) { border-top: 1px solid var(--border); }
    .history table { font-size: 12px; }
    .history thead th, .history tbody td { padding: 10px 8px; }
  }
  @media (max-width: 580px) {
    .container { padding: 0 16px; }
    .hero { padding: 20px; }
    .product-card { padding: 18px 20px; }
    .hero-num { font-size: 36px; }
    .hero-pct { font-size: 26px; }
    .page-head h1 { font-size: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- =============== TOPBAR =============== -->
<div class="topbar">
  <div class="container topbar-inner">
    <div class="brand">
      <div class="brand-mark">P</div>
      <span>Proper</span>
      <span class="brand-sep">/</span>
      <span class="brand-sub">Pauta</span>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-icon" id="theme-btn" aria-label="Cambiar tema">
        <svg id="ico-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg id="ico-moon" style="display:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="btn" id="refresh-btn">
        <svg class="btn-refresh-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
        <span id="refresh-label">Actualizar</span>
      </button>
    </div>
  </div>
</div>

<div class="container">

  <!-- =============== PAGE HEAD =============== -->
  <div class="page-head">
    <div>
      <h1>Presupuesto</h1>
      <div class="sub" id="page-sub">cargando…</div>
    </div>
    <div class="month-select" id="month-select">
      <!-- llenado por JS -->
    </div>
  </div>

  <div id="content">
    <div class="loading">cargando datos…</div>
  </div>

  <div class="footer">
    <div>Fuente: <code>data.json</code> · build-data.py</div>
    <div id="updated-info">—</div>
  </div>

</div>

<script>
(() => {

  /* ============ formatters ============ */
  const fmt = (n, dec = 0) => {
    if (n == null || isNaN(n)) return '—';
    const v = Number(n).toFixed(dec);
    const [i, f] = v.split('.');
    return i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f ? '.' + f : '');
  };
  const sl = (n, dec = 0) => n == null || isNaN(n) ? '—' : `S/ ${fmt(n, dec)}`;
  const pct = (n, dec = 1) => n == null || isNaN(n) ? '—' : `${Number(n).toFixed(dec)}%`;
  const pctI = n => n == null || isNaN(n) ? '—' : `${Math.round(Number(n))}%`;

  const MES_LARGO = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  /* ============ theme ============ */
  const root = document.documentElement;
  const saved = localStorage.getItem('budget-theme-v2') || 'light';
  root.setAttribute('data-theme', saved);
  applyThemeIcon();
  document.getElementById('theme-btn').addEventListener('click', () => {
    const cur = root.getAttribute('data-theme');
    const next = cur === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    localStorage.setItem('budget-theme-v2', next);
    applyThemeIcon();
    if (window._chart && currentMonthKey) {
      const md = getMonthData(currentMonthKey, allData);
      const days = md.isCurrent
        ? (allData.days || [])
        : (allData.days || []).filter(d => (d.fecha || '').startsWith(md.key + '-'));
      renderChart(days, window._lastRange || days.length);
    }
  });
  function applyThemeIcon() {
    const dark = root.getAttribute('data-theme') === 'dark';
    document.getElementById('ico-sun').style.display  = dark ? 'block' : 'none';
    document.getElementById('ico-moon').style.display = dark ? 'none'  : 'block';
  }
  document.getElementById('refresh-btn').addEventListener('click', () => triggerRefresh());

  async function triggerRefresh() {
    const btn   = document.getElementById('refresh-btn');
    const label = document.getElementById('refresh-label');
    if (btn.disabled) return;
    btn.disabled = true;
    btn.classList.remove('success', 'fail');
    btn.classList.add('loading');
    label.textContent = 'Actualizando…';
    try {
      await loadData(true);
      btn.classList.remove('loading');
      btn.classList.add('success');
      label.textContent = 'Actualizado';
    } catch (e) {
      btn.classList.remove('loading');
      btn.classList.add('fail');
      label.textContent = 'Error';
    } finally {
      setTimeout(() => {
        btn.disabled = false;
        btn.classList.remove('success', 'fail');
        label.textContent = 'Actualizar';
      }, 1800);
    }
  }

  /* ============ status logic ============ */
  function chStatus(used, monthPct) {
    if (used > 100)                return { tag: 'over', word: 'pasado',     bar: 'over' };
    if (used > monthPct + 10)      return { tag: 'warn', word: 'acelerado',  bar: 'warn' };
    if (used < monthPct - 25)      return { tag: 'low',  word: 'lento',      bar: '' };
    return                                { tag: 'ok',   word: 'en línea',   bar: '' };
  }
  function histVerdict(p, partial) {
    if (partial)  return { tag: 'low',  word: 'en curso' };
    if (p > 105)  return { tag: 'over', word: 'pasó el tope' };
    if (p > 95)   return { tag: 'warn', word: 'al filo' };
    if (p < 60)   return { tag: 'warn', word: 'muy bajo' };
    return              { tag: 'ok',   word: 'dentro' };
  }

  /* ============ fetch ============ */
  loadData();
  function loadData(force = false) {
    const url = './data.json' + (force ? '?cb=' + Date.now() : '');
    return fetch(url)
      .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
      .then(render)
      .catch(err => {
        document.getElementById('content').innerHTML =
          `<div class="err">No pude cargar data.json — ${err.message}<br>
           Asegurate de servir vía http (no file://).</div>`;
        throw err;
      });
  }

  /* ============ render (entry point) ============ */
  let currentMonthKey = null;
  let allData = null;

  function render(data) {
    allData = data;
    window._lastData = data;

    // Build months list
    const months = buildMonthsList(data);
    if (!months.length) {
      document.getElementById('content').innerHTML = `<div class="err">No hay datos de meses.</div>`;
      return;
    }
    // Default: current month (or first available)
    currentMonthKey = months.find(m => m.isCurrent)?.key || months[0].key;

    // Build the page-head: updated info
    const gen = data.generated_at ? new Date(data.generated_at) : null;
    document.getElementById('updated-info').textContent =
      gen ? `Actualizado ${gen.toLocaleString('es-PE', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}` : '';

    // Render month selector
    renderMonthSelector(months);

    // Render static page structure (sections with placeholders)
    document.getElementById('content').innerHTML = `
      <section class="section" id="sec-hero"></section>
      <section class="section" id="sec-alerts" style="display:none"></section>
      <section class="section" id="sec-products"></section>
      <section class="section" id="sec-chart"></section>
      <section class="section" id="sec-history"></section>
    `;

    // Render history (does NOT change with month)
    renderHistory(data);

    // Render the current view for the selected month
    renderForMonth(currentMonthKey);
  }

  /* ============ build months list from data ============ */
  function buildMonthsList(data) {
    const hm = (data.historical_months || []).slice();
    // sort desc by month key (YYYY-MM)
    hm.sort((a, b) => (b.month || '').localeCompare(a.month || ''));
    return hm.map(m => ({
      key: m.month,
      label: m.label || m.month,
      isCurrent: !!m.is_current,
      isPartial: !!m.is_partial,
      total: m.total_spend || 0,
      pct: m.pct_vs_budget || 0,
      daysIn: m.days_in_month || 31,
      daysCounted: m.days_counted || m.days_in_month || 31,
      raw: m,
    }));
  }

  /* ============ month selector UI ============ */
  function renderMonthSelector(months) {
    const root = document.getElementById('month-select');
    const cur = months.find(m => m.key === currentMonthKey) || months[0];

    root.innerHTML = `
      <button class="month-select-trigger" id="ms-trigger" aria-haspopup="listbox" aria-expanded="false">
        <span class="label">
          <span class="label-main">${monthDisplay(cur)}</span>
          <span class="label-sub">${cur.isPartial ? `día ${cur.daysCounted} de ${cur.daysIn}` : `${cur.daysIn} días · cerrado`} · ${sl(cur.total, 0)}</span>
        </span>
        <svg class="chev" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="month-select-panel" id="ms-panel" role="listbox">
        ${months.map(m => {
          const pctCls = m.isPartial ? '' : m.pct > 105 ? 'over' : m.pct > 95 ? 'warn' : 'ok';
          return `
            <div class="month-option ${m.isCurrent ? 'is-current' : ''} ${m.key === currentMonthKey ? 'selected' : ''}"
                 data-key="${m.key}" role="option" tabindex="0">
              <span class="opt-dot"></span>
              <span class="opt-label">
                <span class="opt-name">${monthDisplay(m)}</span>
                <span class="opt-sub">${sl(m.total, 0)} · ${pctI(m.pct)} del tope</span>
              </span>
              <span class="opt-pct ${pctCls}">${pctI(m.pct)}</span>
            </div>
          `;
        }).join('')}
      </div>
    `;

    const trigger = document.getElementById('ms-trigger');
    const panel   = document.getElementById('ms-panel');

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = panel.classList.toggle('open');
      trigger.classList.toggle('open', open);
      trigger.setAttribute('aria-expanded', String(open));
    });

    document.addEventListener('click', (e) => {
      if (!root.contains(e.target)) {
        panel.classList.remove('open');
        trigger.classList.remove('open');
        trigger.setAttribute('aria-expanded', 'false');
      }
    });

    panel.querySelectorAll('.month-option').forEach(opt => {
      opt.addEventListener('click', () => {
        const key = opt.dataset.key;
        if (key === currentMonthKey) {
          panel.classList.remove('open');
          trigger.classList.remove('open');
          return;
        }
        currentMonthKey = key;
        panel.classList.remove('open');
        trigger.classList.remove('open');
        renderMonthSelector(months); // re-render to update selected/trigger label
        renderForMonth(currentMonthKey);
      });
    });
  }

  function monthDisplay(m) {
    if (!m || !m.key) return m?.label || '—';
    const [y, mo] = m.key.split('-');
    return `${MES_LARGO[parseInt(mo, 10) - 1]} ${y}`;
  }

  /* ============ derive month data (works for current + past) ============ */
  function getMonthData(monthKey, data) {
    const hm = (data.historical_months || []).find(m => m.month === monthKey);
    const isCurrent = !!hm?.is_current;
    const isPartial = !!hm?.is_partial;
    let md;

    if (isCurrent && data.budget_by_product) {
      // Use live data
      const bbp = data.budget_by_product;
      md = {
        key: monthKey,
        isCurrent: true,
        isPartial: !!bbp.pct_month_elapsed && bbp.pct_month_elapsed < 100,
        daysIn: bbp.days_in_month || 31,
        daysE:  bbp.days_elapsed  || 0,
        pctMonth: bbp.pct_month_elapsed || 0,
        total: bbp.total || {},
        products: JSON.parse(JSON.stringify(bbp.products || {})),  // deep clone (we'll attach _daily/_proj)
      };
      return enrichWithPlatformMetrics(md, data);
    }
    // Past month — derive from historical_months[]
    if (!hm) return null;

    // Assume budgets stay the same as the active budget_by_product (best we have)
    const bbpRef = data.budget_by_product || {};
    const refTotal = bbpRef.total || {};
    const refProducts = bbpRef.products || {};
    const totalBudget = refTotal.budget || hm.budget_referencial || 9300;

    const totalSpend = hm.total_spend || 0;
    const daysIn = hm.days_in_month || 31;
    const daysCounted = hm.days_counted || daysIn;
    const runRate = daysCounted > 0 ? totalSpend / daysCounted : 0;
    const remaining = totalBudget - totalSpend;

    // build products
    const products = {};
    ['inversiones', 'rentas'].forEach(pk => {
      const histP   = hm[pk] || {};
      const refP    = refProducts[pk] || {};
      const refChan = refP.channels || {};
      const pBudget = refP.budget || 0;
      const channels = {};
      ['facebook', 'google'].forEach(ck => {
        const mtd = histP[ck] || 0;
        const cBudget = (refChan[ck] || {}).budget || 0;
        channels[ck] = {
          budget: cBudget,
          mtd: mtd,
          pct_used: cBudget > 0 ? (mtd / cBudget) * 100 : 0,
          projected_eom: mtd, // already closed
          run_rate_daily: daysCounted > 0 ? mtd / daysCounted : 0,
          campaigns: [], // not tracked historically
        };
      });
      const pSpend = (histP.facebook || 0) + (histP.google || 0);
      products[pk] = {
        budget: pBudget,
        mtd: pSpend,
        pct_used: pBudget > 0 ? (pSpend / pBudget) * 100 : 0,
        channels,
      };
    });

    md = {
      key: monthKey,
      isCurrent: false,
      isPartial: isPartial,
      daysIn,
      daysE: daysCounted,
      pctMonth: 100, // closed
      total: {
        budget: totalBudget,
        mtd: totalSpend,
        pct_used: totalBudget > 0 ? (totalSpend / totalBudget) * 100 : 0,
        run_rate_daily: runRate,
        projected_eom: totalSpend, // final
        remaining_budget: remaining,
      },
      products,
    };
    return enrichWithPlatformMetrics(md, data);
  }

  /* ============ enrich monthData with platform/channel daily + projection ============ */
  function enrichWithPlatformMetrics(md, data) {
    const monthPrefix = md.key + '-';
    const monthDays = (data.days || []).filter(d => (d.fecha || '').startsWith(monthPrefix));

    // Days with spend > 0 per platform
    md.metaDaysWithSpend   = Math.max(monthDays.filter(d => (d.meta_spend || 0) > 0).length, 1);
    md.googleDaysWithSpend = Math.max(monthDays.filter(d => (d.gads_spend || 0) > 0).length, 1);

    // Totals per platform (sum across both products)
    md.metaMtd   = (md.products?.inversiones?.channels?.facebook?.mtd || 0)
                 + (md.products?.rentas?.channels?.facebook?.mtd      || 0);
    md.googleMtd = (md.products?.inversiones?.channels?.google?.mtd   || 0)
                 + (md.products?.rentas?.channels?.google?.mtd        || 0);

    md.metaDaily   = md.metaMtd   / md.metaDaysWithSpend;
    md.googleDaily = md.googleMtd / md.googleDaysWithSpend;

    md.daysRem = Math.max(md.daysIn - md.daysE, 0);

    // Per-channel daily + projection (only if current; closed months stay as totals)
    ['inversiones', 'rentas'].forEach(pk => {
      const p = md.products?.[pk];
      if (!p?.channels) return;
      // facebook
      if (p.channels.facebook) {
        const cMtd = p.channels.facebook.mtd || 0;
        const cDaily = cMtd / md.metaDaysWithSpend;
        p.channels.facebook._daily = cDaily;
        p.channels.facebook._proj  = md.isCurrent ? (cMtd + cDaily * md.daysRem) : cMtd;
      }
      // google
      if (p.channels.google) {
        const cMtd = p.channels.google.mtd || 0;
        const cDaily = cMtd / md.googleDaysWithSpend;
        p.channels.google._daily = cDaily;
        p.channels.google._proj  = md.isCurrent ? (cMtd + cDaily * md.daysRem) : cMtd;
      }
    });

    // Totals projected (sum of platform projections)
    md.metaProj   = md.isCurrent ? md.metaMtd   + md.metaDaily   * md.daysRem : md.metaMtd;
    md.googleProj = md.isCurrent ? md.googleMtd + md.googleDaily * md.daysRem : md.googleMtd;
    md.totalProj  = md.metaProj + md.googleProj;

    return md;
  }

  /* ============ ALERTS logic + render ============ */
  // Thresholds (balanced):
  //   acelerado     : real > esperado × 1.10
  //   subutilizado  : real < esperado × 0.75
  //   crítico       : real ya superó el 100% del tope
  //   high underuse : real < esperado × 0.50 (severo)
  function getAlerts(md) {
    if (!md.isCurrent) return []; // alertas solo para mes en curso
    const alerts = [];
    const pctMonth = md.pctMonth || 0;
    const TH_OVER = 1.10;     // acelerado
    const TH_UNDER = 0.75;    // subutilizado
    const TH_UNDER_HIGH = 0.50; // muy subutilizado

    ['inversiones', 'rentas'].forEach(pk => {
      const p = md.products?.[pk];
      if (!p?.channels) return;
      Object.entries(p.channels).forEach(([ck, cv]) => {
        const realPct = cv.pct_used || 0;
        const projPct = cv.budget > 0 ? (cv._proj / cv.budget) * 100 : 0;
        const ratio = pctMonth > 0 ? realPct / pctMonth : 1;

        const productLabel = pk === 'inversiones' ? 'Inversiones' : 'Rentas';
        const channelLabel = ck === 'facebook' ? 'Meta' : 'Google';
        const channelKey = ck;
        const overshoot   = cv._proj - cv.budget;
        const undershoot  = cv.budget - cv._proj;

        // 1) CRÍTICO — ya superó el tope
        if (realPct > 100) {
          alerts.push({
            severity: 'critical',
            tag: 'over',
            productLabel, channelLabel, channelKey,
            title: 'Tope superado',
            msg: `Llevás <strong>${sl(cv.mtd, 0)}</strong> de ${sl(cv.budget, 0)} (${pct(realPct, 1)}). Excediste el tope por <strong>${sl(cv.mtd - cv.budget, 0)}</strong>.`,
            rec: `Pausá la campaña o bajá los daily caps en ${channelLabel} ya.`,
          });
          return;
        }
        // 2) HIGH — proyecta excederse >10% sobre tope
        if (projPct > 110) {
          alerts.push({
            severity: 'high',
            tag: 'over',
            productLabel, channelLabel, channelKey,
            title: 'Sobre-gasto proyectado',
            msg: `Llevás <strong>${pct(realPct, 1)}</strong> con ${pct(pctMonth, 1)} del mes corrido. Si seguís así, cerrás en <strong>${sl(cv._proj, 0)}</strong> → <strong>${sl(overshoot, 0)}</strong> sobre el tope.`,
            rec: `Bajá el daily budget ~${Math.round((overshoot / Math.max(cv._proj, 1)) * 100)}% en ${channelLabel} para llegar al tope.`,
          });
          return;
        }
        // 3) ACELERADO — leve, ratio > 1.10 pero proj < 110% del tope
        if (ratio > TH_OVER) {
          alerts.push({
            severity: 'medium',
            tag: 'warn',
            productLabel, channelLabel, channelKey,
            title: 'Acelerado',
            msg: `Llevás <strong>${pct(realPct, 1)}</strong>, esperado ${pct(pctMonth, 1)}. Proyectás cerrar en <strong>${sl(cv._proj, 0)}</strong>${overshoot > 0 ? ` → ${sl(overshoot, 0)} sobre tope` : ''}.`,
            rec: overshoot > 0
              ? `Vigilá los próximos días — si el ritmo sigue, cerrás levemente arriba.`
              : `Vas adelantado pero todavía dentro del tope. Sin acción necesaria.`,
          });
          return;
        }
        // 4) MUY SUBUTILIZADO — ratio < 0.50
        if (ratio < TH_UNDER_HIGH) {
          alerts.push({
            severity: 'high',
            tag: 'under',
            productLabel, channelLabel, channelKey,
            title: 'Muy subutilizado',
            msg: `Llevás solo <strong>${pct(realPct, 1)}</strong> cuando deberías ir en ${pct(pctMonth, 1)}. Proyectás cerrar en <strong>${sl(cv._proj, 0)}</strong> → <strong>${sl(undershoot, 0)}</strong> sin usar.`,
            rec: `Subí el daily budget en ${channelLabel} o reasigná los ${sl(undershoot, 0)} a otro canal con mejor performance.`,
          });
          return;
        }
        // 5) SUBUTILIZADO — ratio < 0.75
        if (ratio < TH_UNDER) {
          alerts.push({
            severity: 'medium',
            tag: 'under',
            productLabel, channelLabel, channelKey,
            title: 'Bajo ritmo',
            msg: `Llevás <strong>${pct(realPct, 1)}</strong>, esperado ${pct(pctMonth, 1)}. Proyectás cerrar en <strong>${sl(cv._proj, 0)}</strong> → ${sl(undershoot, 0)} sin usar.`,
            rec: `Considerá subir el daily budget en ${channelLabel} si querés acercarte al tope.`,
          });
          return;
        }
      });
    });

    // Sort by severity (critical → high → medium)
    const sevOrder = { critical: 0, high: 1, medium: 2 };
    alerts.sort((a, b) => sevOrder[a.severity] - sevOrder[b.severity]);
    return alerts;
  }

  function renderAlerts(md) {
    const alerts = getAlerts(md);
    const sec = document.getElementById('sec-alerts');
    if (!alerts.length) {
      sec.style.display = 'none';
      sec.innerHTML = '';
      return;
    }
    sec.style.display = '';

    const headlineText = alerts.length === 1
      ? '1 canal necesita atención'
      : `${alerts.length} canales necesitan atención`;

    sec.innerHTML = `
      <div class="section-head">
        <div>
          <h2 class="section-title">Atención</h2>
          <div class="section-desc">${headlineText}. Click en cualquier alerta para abrir el detalle del canal.</div>
        </div>
        <div class="alerts-summary">
          ${alerts.filter(a => a.severity === 'critical').length ? `<span class="count" style="color: var(--danger)">${alerts.filter(a => a.severity === 'critical').length} crítica</span> · ` : ''}
          ${alerts.filter(a => a.severity === 'high').length ? `<span class="count">${alerts.filter(a => a.severity === 'high').length} importante${alerts.filter(a => a.severity === 'high').length > 1 ? 's' : ''}</span> · ` : ''}
          ${alerts.filter(a => a.severity === 'medium').length ? `<span class="count">${alerts.filter(a => a.severity === 'medium').length} leve${alerts.filter(a => a.severity === 'medium').length > 1 ? 's' : ''}</span>` : ''}
        </div>
      </div>
      <article class="card alerts-card">
        ${alerts.map(a => `
          <div class="alert alert-${a.severity} ${a.tag === 'under' ? 'alert-under' : ''}">
            <div class="alert-marker"></div>
            <div class="alert-body">
              <div class="alert-head">
                <span class="alert-icons">${a.channelKey === 'facebook' ? facebookLogoSmall() : googleLogoSmall()}</span>
                <span class="alert-product">${a.productLabel}</span>
                <span class="alert-channel">${a.channelLabel}</span>
                <span class="alert-tag ${a.tag}"><span class="dot"></span>${a.title}</span>
              </div>
              <div class="alert-msg">${a.msg}</div>
              <div class="alert-rec">${a.rec}</div>
            </div>

        `).join('')}
      </article>
    `;
  }

  /* ============ HERO render ============ */
  function renderHero(md) {
    const total = md.total;
    const ritmoIdeal = md.pctMonth;
    const ritmoActual = total.pct_used || 0;
    const isCur = md.isCurrent;

    // Read precomputed platform metrics from md (set by enrichWithPlatformMetrics)
    const metaMtd = md.metaMtd, googleMtd = md.googleMtd;
    const metaDaysWithSpend = md.metaDaysWithSpend, googleDaysWithSpend = md.googleDaysWithSpend;
    const metaDaily = md.metaDaily, googleDaily = md.googleDaily;
    const metaProj = md.metaProj, googleProj = md.googleProj;
    const totalProj = md.totalProj;
    const diff = (total.budget || 0) - totalProj;

    let proyCls = 'delta-up', proyArrow = '↓', proyTxt = 'bajo el tope';
    if (diff < -(total.budget || 0) * 0.02) { proyCls = 'delta-down'; proyArrow = '↑'; proyTxt = 'sobre el tope'; }
    else if (diff < (total.budget || 0) * 0.02) { proyCls = 'delta-warn'; proyArrow = '≈'; proyTxt = 'al filo'; }

    // Labels
    const heroLblTxt = isCur
      ? `Gastado este mes · de <strong>${sl(total.budget, 0)}</strong>`
      : `Total gastado en ${monthDisplay(md).split(' ')[0]} · tope ref. <strong>${sl(total.budget, 0)}</strong>`;

    const proyLbl = isCur ? 'Proyección si seguimos así' : 'Total final';

    const progressFootCenter = isCur
      ? `<span class="ideal">ritmo ideal · ${pct(ritmoIdeal, 1)}</span>`
      : `<span style="color:var(--muted-2)">mes cerrado · ${md.daysIn} días</span>`;

    const markerHtml = isCur
      ? `<div class="progress-marker" style="left:${Math.min(ritmoIdeal, 100)}%"></div>`
      : '';

    // Sub-texts per platform
    const metaSub = isCur
      ? `en ${metaDaysWithSpend} días con gasto · proyecta ${sl(metaProj, 0)}`
      : `${metaDaysWithSpend} días con gasto · total ${sl(metaMtd, 0)}`;
    const googleSub = isCur
      ? `en ${googleDaysWithSpend} días con gasto · proyecta ${sl(googleProj, 0)}`
      : `${googleDaysWithSpend} días con gasto · total ${sl(googleMtd, 0)}`;

    document.getElementById('sec-hero').innerHTML = `
      <article class="card hero">
        <div class="hero-top">
          <div>
            <div class="hero-num">
              <span class="cur">S/</span>${fmt(total.mtd, 0)}
            </div>
            <div class="hero-lbl">${heroLblTxt}</div>
          </div>
          <div class="hero-right">
            <div class="hero-pct">${pct(total.pct_used, 1)}</div>
            <div class="hero-pct-lbl">del tope usado</div>
          </div>
        </div>

        <div class="progress" title="${isCur ? 'Ritmo gastado vs ritmo del mes' : 'Gasto final vs tope'}">
          <div class="progress-fill ${ritmoActual > 100 ? 'over' : isCur && ritmoActual > ritmoIdeal + 10 ? 'warn' : ''}" style="width:${Math.min(ritmoActual, 100)}%"></div>
          ${markerHtml}
        </div>
        <div class="progress-foot">
          <span>0%</span>
          ${progressFootCenter}
          <span>tope · ${sl(total.budget, 0)}</span>
        </div>

        <div class="hero-stats">
          <div class="hero-stat">
            <div class="hero-stat-lbl">${facebookLogoSmall()} ${isCur ? 'Ritmo Meta' : 'Promedio Meta'}</div>
            <div class="hero-stat-val"><span class="cur">S/</span>${fmt(metaDaily, 0)}<span class="unit"> /día</span></div>
            <div class="hero-stat-sub">${metaSub}</div>
          </div>
          <div class="hero-stat">
            <div class="hero-stat-lbl">${googleLogoSmall()} ${isCur ? 'Ritmo Google' : 'Promedio Google'}</div>
            <div class="hero-stat-val"><span class="cur">S/</span>${fmt(googleDaily, 0)}<span class="unit"> /día</span></div>
            <div class="hero-stat-sub">${googleSub}</div>
          </div>
          <div class="hero-stat">
            <div class="hero-stat-lbl">${proyLbl}</div>
            <div class="hero-stat-val"><span class="cur">S/</span>${fmt(totalProj, 0)}</div>
            <div class="hero-stat-sub">
              <span class="delta ${proyCls}">${proyArrow}${sl(Math.abs(diff), 0)}</span>
              ${proyTxt}
            </div>
          </div>
        </div>
      </article>
    `;
  }

        ${allCamps.length && isCurrent ? `
          <div class="campaigns">
            ${allCamps.slice(0, 8).map(c => `
              <div class="campaign">
                <div class="campaign-name">
                  <span class="campaign-chip">${c.channel === 'facebook' ? facebookLogo() : googleLogo()}</span>
                  ${c.name || c.id || '—'}
                </div>
                <div class="campaign-spend">${sl(c.spend, 0)}</div>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </article>
    `;
  }

  /* ============ chart ============ */
  function renderChart(daysSource, lastN) {
    window._lastRange = lastN;
    // Accept either an array of days (new API) or legacy {days:[...]} object
    const sourceArr = Array.isArray(daysSource) ? daysSource : (daysSource?.days || []);
    const days = sourceArr.slice(-lastN);
    if (!days.length) {
      const wrap = document.querySelector('.chart-wrap');
      if (wrap) wrap.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:13px;">Sin días para este mes.</div>`;
      const statsEl = document.getElementById('chart-stats');
      if (statsEl) statsEl.innerHTML = '';
      return;
    }

    const css = getComputedStyle(document.documentElement);
    const cv = n => css.getPropertyValue(n).trim();
    const isDark = root.getAttribute('data-theme') === 'dark';

    // Meta brand blue + Google brand blue. Keeping recognizable.
    const colorMeta   = '#1877F2';  // Facebook blue
    const colorGoogle = '#4285F4';  // Google blue
    const muted = cv('--muted');
    const border = cv('--border');
    const bgCard = cv('--bg-card');

    const labels    = days.map(d => {
      const [, m, dd] = (d.fecha || '').split('-');
      return `${dd}/${m}`;
    });
    const metaData  = days.map(d => Number(d.meta_spend) || 0);
    const googleData = days.map(d => Number(d.gads_spend) || 0);

    if (window._chart) window._chart.destroy();
    const ctx = document.getElementById('daily-chart');
    if (!ctx) return;

    window._chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'Meta Ads',
            data: metaData,
            borderColor: colorMeta,
            backgroundColor: colorMeta + '14',
            borderWidth: 2,
            pointRadius: 0,
            pointHoverRadius: 4,
            pointHoverBackgroundColor: bgCard,
            pointHoverBorderColor: colorMeta,
            pointHoverBorderWidth: 2,
            tension: 0.32,
            fill: true,
          },
          {
            label: 'Google Ads',
            data: googleData,
            borderColor: colorGoogle,
            backgroundColor: 'transparent',
            borderWidth: 1.8,
            borderDash: [4, 3],
            pointRadius: 0,
            pointHoverRadius: 4,
            pointHoverBackgroundColor: bgCard,
            pointHoverBorderColor: colorGoogle,
            pointHoverBorderWidth: 2,
            tension: 0.32,
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 500, easing: 'easeOutCubic' },
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: isDark ? '#1B1F26' : '#101828',
            titleColor: '#F2F4F7',
            bodyColor: '#F2F4F7',
            borderColor: isDark ? '#353B45' : 'transparent',
            borderWidth: isDark ? 1 : 0,
            padding: 12,
            cornerRadius: 8,
            displayColors: true,
            boxWidth: 8, boxHeight: 8, boxPadding: 6,
            titleFont: { family: cv('--font'), size: 12, weight: '600' },
            bodyFont: { family: cv('--font'), size: 12 },
            callbacks: {
              title: items => items[0]?.label,
              label: ctx => `  ${ctx.dataset.label}  S/ ${fmt(ctx.parsed.y, 2)}`
            }
          }
        },
        scales: {
          x: {
            grid: { display: false },
            border: { color: border, width: 1 },
            ticks: {
              color: muted,
              font: { family: cv('--font'), size: 11 },
              maxRotation: 0,
              autoSkip: true,
              autoSkipPadding: 20,
            }
          },
          y: {
            beginAtZero: true,
            grid: { color: border, drawTicks: false, lineWidth: 1 },
            border: { display: false },
            ticks: {
              color: muted,
              font: { family: cv('--font'), size: 11 },
              padding: 10,
              callback: v => 'S/ ' + fmt(v, 0)
            }
          }
        }
      }
    });

    // chart stats
    const sumM = metaData.reduce((a,b) => a+b, 0);
    const sumG = googleData.reduce((a,b) => a+b, 0);
    const tot  = sumM + sumG;
    const avgM = sumM / metaData.length;
    const avgG = sumG / googleData.length;
    const maxMv = Math.max(...metaData);
    const maxMi = metaData.indexOf(maxMv);
    const maxMdate = days[maxMi]?.fecha?.slice(5) || '—';

    document.getElementById('chart-stats').innerHTML = `
      <div class="chart-stat">
        <div class="chart-stat-lbl">Promedio Meta</div>
        <div class="chart-stat-val"><span class="cur">S/</span>${fmt(avgM, 0)}</div>
        <div class="chart-stat-sub">por día · ${lastN}d</div>
      </div>
      <div class="chart-stat">
        <div class="chart-stat-lbl">Promedio Google</div>
        <div class="chart-stat-val"><span class="cur">S/</span>${fmt(avgG, 0)}</div>
        <div class="chart-stat-sub">por día · ${lastN}d</div>
      </div>
      <div class="chart-stat">
        <div class="chart-stat-lbl">Pico Meta</div>
        <div class="chart-stat-val"><span class="cur">S/</span>${fmt(maxMv, 0)}</div>
        <div class="chart-stat-sub">el ${maxMdate}</div>
      </div>
      <div class="chart-stat">
        <div class="chart-stat-lbl">Reparto del gasto</div>
        <div class="chart-stat-val">${Math.round(sumM/Math.max(tot,1)*100)}<span class="cur"> · </span>${Math.round(sumG/Math.max(tot,1)*100)}</div>
        <div class="chart-stat-sub">Meta / Google · total ${sl(tot, 0)}</div>
      </div>
    `;
  }

  /* ============ history row ============ */
  function renderHistRow(m) {
    const isCur  = m.is_current;
    const isPart = m.is_partial;
    const inv = m.inversiones || {};
    const ren = m.rentas      || {};
    const tot = m.total_spend || 0;
    const p   = m.pct_vs_budget || 0;
    const v   = histVerdict(p, isPart);
    const fillW = Math.min(p, 130);
    const fillCls = v.tag === 'over' ? 'over' : v.tag === 'warn' ? 'warn' : v.tag === 'low' ? 'partial' : 'ok';

    return `
      <tr class="${isCur ? 'current' : ''}">
        <td>
          ${m.label || m.month}
          <small>${m.days_counted || m.days_in_month} / ${m.days_in_month} días</small>
        </td>
        <td>${sl(inv.facebook, 0)}</td>
        <td>${sl(inv.google, 0)}</td>
        <td>${sl(ren.facebook, 0)}</td>
        <td>${sl(ren.google, 0)}</td>
        <td class="total">${sl(tot, 0)}</td>
        <td class="verdict-cell">
          <div class="mini-bar">
            <div class="fill ${fillCls}" style="width:${fillW}%"></div>
            <div class="target"></div>
          </div>
          <div class="verdict-row">
            <span class="pill pill-${v.tag === 'low' ? 'low' : v.tag === 'over' ? 'over' : v.tag === 'warn' ? 'warn' : 'ok'}">${v.word}</span>
            <span class="pct" style="color:${p > 100 ? 'var(--danger)' : 'var(--text)'}">${pctI(p)}</span>
          </div>
        </td>
      </tr>
    `;
  }

  /* ============ BRAND LOGOS (Simple Icons paths, CC0) ============ */

    // Color: #1877F2 (Facebook blue)
    return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>`;
  }

    return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:14px;height:14px"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>`;
  }

      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>

      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>

})();
